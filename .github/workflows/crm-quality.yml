name: CRM quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run CRM application tests
        env:
          CRM_TEST_EXECUTOR: GitHub Actions developer verification
          CRM_TEST_LIVE_AI: "false"
        run: npm test

      - name: Run integration preparation tests
        env:
          CRM_TEST_EXECUTOR: GitHub Actions integration preparation
          CRM_TEST_LIVE_AI: "false"
        run: npm run test:integration-prep

      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-evidence/
          if-no-files-found: warn